<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" id="theme-color">
<title>Aukcje JP – opłacalność importu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23ff453a'/%3E%3C/svg%3E">
<script>
/* Motyw ustawiany przed narysowaniem strony, żeby nie było mignięcia. */
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#/" aria-label="Aukcje JP – strona główna"><span class="brand-dot"></span>Aukcje&nbsp;JP</a>
    <nav class="tabs" aria-label="Główna nawigacja">
      <a href="#/" data-nav="list">Aukcje</a>
      <a href="#/kalkulator" data-nav="calc">Kalkulator</a>
    </nav>
    <div class="nav-right">
      <div class="rate" id="rate" title="Średni kurs NBP"></div>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Przełącz motyw jasny / ciemny" title="Motyw jasny / ciemny">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap foot" id="foot"></footer>

<script src="data/rate.js"></script>
<script src="data/meta.js"></script>
<script src="data/cars.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
