# Codzienne odswiezanie danych i publikacja strony (GitHub Pages).
# 13:30 czasu polskiego: zima = 12:30 UTC, lato = 11:30 UTC - uruchamiamy o obu godzinach,
# a krok "Czy to 13:xx w Polsce" przepuszcza tylko wlasciwa.
name: Odswiezanie aukcji

on:
  schedule:
    # GitHub potrafi opoznic zaplanowane uruchomienie nawet o kilka godzin, dlatego prob jest duzo
    # (co 30 minut). Prawdziwe odswiezanie robi tylko pierwsza proba po 13:30 czasu polskiego.
    - cron: '7,37 6-20 * * *'
  # Po wyslaniu poprawki strony lub programu: szybka publikacja (bez ponownego pobierania aukcji).
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/data/**'
      - 'scraper/**'
      - 'config.json'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      tryb:
        description: 'full = wszystko, rate = tylko kurs jena'
        default: 'full'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: odswiezanie
  cancel-in-progress: false

jobs:
  odswiez:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Czy to 13:xx w Polsce
        id: czas
        shell: pwsh
        run: |
          # Uruchom przy pierwszym wywolaniu po 13:00 czasu polskiego, o ile dzis jeszcze nie odswiezano.
          $tz = [TimeZoneInfo]::FindSystemTimeZoneById('Europe/Warsaw')
          $now = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
          $start = $now.Date.AddHours(13).AddMinutes(30)
          $last = [DateTime]::MinValue
          # czas ostatniego PELNEGO odswiezenia aukcji (zapisany w danych strony)
          if (Test-Path site/data/meta.js) {
            $m = [regex]::Match((Get-Content site/data/meta.js -Raw), '"updated":"([^"]+)"')
            if ($m.Success) {
              $u = [DateTime]::Parse($m.Groups[1].Value, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal)
              $last = [TimeZoneInfo]::ConvertTimeFromUtc($u, $tz)
            }
          }
          $ev = '${{ github.event_name }}'
          $ok = ($ev -ne 'schedule') -or ($now -ge $start -and $last -lt $start)
          $mode = 'full'
          if ($ev -eq 'push') { $mode = 'rate' }
          if ('${{ github.event.inputs.tryb }}') { $mode = '${{ github.event.inputs.tryb }}' }
          "Teraz (PL): $now, ostatnie pelne odswiezenie (PL): $last, uruchamiam: $ok, tryb: $mode"
          "run=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Pobierz aukcje i wyceny
        if: steps.czas.outputs.run == 'true'
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: ./scraper/run.ps1 -Mode ${{ steps.czas.outputs.mode }}

      - name: Zapisz dane w repozytorium
        if: steps.czas.outputs.run == 'true'
        run: |
          git config user.name "aukcje-bot"
          git config user.email "aukcje-bot@users.noreply.github.com"
          git add -A state site/data
          git diff --cached --quiet || git commit -m "Dane z $(date -u +%Y-%m-%d)"
          git push

      - name: Przygotuj strone
        if: steps.czas.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Opublikuj strone
        if: steps.czas.outputs.run == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
